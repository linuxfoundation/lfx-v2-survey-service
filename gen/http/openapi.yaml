            - title
    SurveyUpdateSurveyRequestBody:
        title: SurveyUpdateSurveyRequestBody
        type: object
        properties:
            committee_uid:
                type: string
                description: Committee UID to send survey to
                example: qa1e8536-a985-4cf5-b981-a170927a1d11
            committee_voting_enabled:
                type: boolean
                description: Whether committee voting is enabled
                example: false
            creator_id:
                type: string
                description: Ignored. The modifier is the authenticated user.
                example: Facilis vero ut et non.
            email_body:
                type: string
                description: Email body HTML content
                example: Et nesciunt provident adipisci optio autem.
            email_body_text:
                type: string
                description: Email body plain text content
                example: Totam iste.
            email_subject:
                type: string
                description: Email subject line
                example: Libero voluptatem ullam nemo libero.
            survey_cutoff_date:
                type: string
                description: Survey cutoff/end date (RFC3339 format)
                example: Ratione quod adipisci et quibusdam et.
